const ANCHOR = 255, TIP = 12, LID = "#1a1a5e";

window.Avatar = (function(){
  const cv = document.querySelector('.avatar canvas'), ctx = cv.getContext('2d');
  const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  let visible = true, last = performance.now(), clock = 0, t = 0;
  new IntersectionObserver(e => { visible = e[0].isIntersecting; }).observe(cv);

  /* Scroll: 0 cuando el avatar asoma por abajo, 1 cuando sale por arriba */
  let manual = null, prog = 0;
  function scrollTarget(){
    if (manual !== null) return manual;
    const r = cv.getBoundingClientRect(), vh = innerHeight;
    return Math.min(1, Math.max(0, (vh - r.top) / (vh + r.height)));
  }
  addEventListener('message', e => { if (e.data && typeof e.data.avatarScroll === 'number') manual = e.data.avatarScroll; });
  const ease = p => p * p * (3 - 2 * p);

  /* Parpadeo */
  let nextBlink = rand(1, 3), blinkStart = -1, blinkQueue = 0;
  function lidAmount(now){
    if (blinkStart < 0) return 0;
    const e = now - blinkStart;
    if (e < 0.07) return e / 0.07;
    if (e < 0.13) return 1;
    if (e < 0.24) return 1 - (e - 0.13) / 0.11;
    blinkStart = -1;
    if (blinkQueue > 0){ blinkQueue--; nextBlink = now + 0.12; } else nextBlink = now + rand(BLINK_EVERY[0], BLINK_EVERY[1]);
    return 0;
  }
  function drawEye(e, p){
    if (p <= 0) return;
    const lidY = e.cy - e.ry + p * e.ry * 2;
    ctx.save(); ctx.beginPath(); ctx.ellipse(e.cx, e.cy, e.rx, e.ry, 0, 0, Math.PI * 2); ctx.clip();
    ctx.beginPath(); ctx.rect(e.x, e.y, e.rx * 2 + 6, lidY - e.y); ctx.clip(); ctx.drawImage(e.im, e.x, e.y); ctx.restore();
    ctx.strokeStyle = LID; ctx.lineCap = 'round';
    if (p < 0.97){
      ctx.save(); ctx.beginPath(); ctx.ellipse(e.cx, e.cy, e.rx * 0.75, e.ry * 0.8, 0, 0, Math.PI * 2); ctx.clip();
      ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(e.x, lidY); ctx.lineTo(e.x + e.rx * 2 + 6, lidY); ctx.stroke(); ctx.restore();
    } else { ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(e.cx, e.cy + e.ry * 0.1, e.rx * 0.6, e.ry * 0.3, 0, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke(); }
  }

  Promise.all([BG, FG, CAPE.img, BODY.img, ...EYES.map(e => e.img)].map(load)).then(([bg, fg, cape, body, ...eyeImgs]) => {
    EYES.forEach((e, i) => e.im = eyeImgs[i]);
    prog = scrollTarget();
    function draw(now){
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!visible) return requestAnimationFrame(draw);
      if (!still){ clock += dt; t += dt * SPEED; }
      prog += (scrollTarget() - prog) * (still ? 1 : Math.min(1, dt * SMOOTH));
      const k = ease(prog);

      // Paisaje: zoom hacia el sol
      const s = 1 + ZOOM * k;
      ctx.save(); ctx.translate(FOCUS.x, FOCUS.y); ctx.scale(s, s); ctx.translate(-FOCUS.x, -FOCUS.y);
      ctx.drawImage(bg, 0, 0); ctx.restore();
      if (SUN_GLOW > 0){
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(FOCUS.x, FOCUS.y, 0, FOCUS.x, FOCUS.y, 420);
        g.addColorStop(0, `rgba(255,200,140,${SUN_GLOW * k})`); g.addColorStop(1, 'rgba(255,160,120,0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
      }

      // Primer plano (colina, árbol y personaje)
      const fs = 1 + FG_ZOOM * k;
      ctx.save(); ctx.translate(cv.width * 0.3, cv.height); ctx.scale(fs, fs); ctx.translate(-cv.width * 0.3, -cv.height);
      ctx.drawImage(fg, 0, 0);
      for (let sx = 0; sx < cape.width; sx += 2){
        const x = CAPE.x + sx, d = Math.max(0, Math.min(1, (ANCHOR - x) / (ANCHOR - TIP)));
        const e = Math.pow(d, 1.4), ph = t * 3.4 - d * 6.5;
        const dy = WIND * e * (Math.sin(ph) + 0.3 * Math.sin(ph * 1.7 + 1.1));
        ctx.drawImage(cape, sx, 0, 2, cape.height, x, CAPE.y + dy, 2, cape.height * (1 + 0.03 * e * Math.sin(ph - 0.9)));
      }
      ctx.drawImage(body, BODY.x, BODY.y);
      if (!still && blinkStart < 0 && clock >= nextBlink){ blinkStart = clock; blinkQueue = Math.random() < DOUBLE_BLINK ? 1 : 0; }
      const p = still ? 0 : lidAmount(clock); EYES.forEach(e => drawEye(e, p));
      ctx.restore();
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  });

  /* Si el avatar va dentro de un iframe, la página puede enviarle el progreso:
     iframe.contentWindow.postMessage({ avatarScroll: 0.5 }, '*')   (0 a 1)          */
  return { setProgress(p){ manual = p; }, auto(){ manual = null; } };
})();
